[package]
name = "darknamer-legacy-app"
description = "Native Win32 compatibility application for DarkNamer 08.02.10"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "DarkNamer"
path = "src/main.rs"

[dependencies]
dark-renamer-legacy = { path = "../dark-renamer-legacy" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
