[package]
name = "dark-renamer-app"
description = "Native desktop application for Dark Renamer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dark-renamer"
path = "src/main.rs"

[dependencies]
dark-renamer-core = { path = "../dark-renamer-core" }
dark-renamer-platform = { path = "../dark-renamer-platform" }
eframe = { version = "=0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
rfd = "=0.17.2"

[dev-dependencies]
egui_kittest = "=0.36.1"
kittest = "=0.4.0"

[lints]
workspace = true
