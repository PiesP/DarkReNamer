[workspace]
members = [
  "crates/darknamer-app",
  "crates/darknamer-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["PiesP"]
license = "MIT"
repository = "https://github.com/PiesP/DarkReNamer"
homepage = "https://github.com/PiesP/DarkReNamer"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"

[profile.release.package.darknamer-core]
opt-level = 3

[profile.release.package.darknamer-app]
opt-level = 3
