name: Portable prerelease candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: candidate/build-windows
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source metadata before build
        id: source
        shell: pwsh
        run: |
          $eventSha = '${{ github.sha }}'
          if ($eventSha -cnotmatch '^[0-9a-f]{40}$') {
            throw 'The workflow event SHA must be a full source commit SHA.'
          }
          $sourceCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -cnotmatch '^[0-9a-f]{40}$') {
            throw 'The selected source commit could not be resolved as a full SHA.'
          }
          if ($sourceCommit -cne $eventSha) {
            throw 'The checked-out source does not match the workflow event SHA.'
          }
          $remoteMaster = @(& git ls-remote origin refs/heads/master)
          if ($LASTEXITCODE -ne 0 -or $remoteMaster.Count -ne 1 -or
              $remoteMaster[0] -cnotmatch '^[0-9a-f]{40}\trefs/heads/master$') {
            throw 'The live origin/master commit could not be resolved.'
          }
          if (($remoteMaster[0] -split "`t")[0] -cne $sourceCommit) {
            throw 'The workflow event is stale; dispatch a new candidate run from current master.'
          }
          $epoch = git show -s --format=%ct $sourceCommit
          if ($LASTEXITCODE -ne 0 -or $epoch -notmatch '^\d+$') {
            throw 'The selected source commit timestamp could not be resolved.'
          }
          $label = "dry-run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "source_commit=$sourceCommit" | Out-File `
            -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "handoff_name=DarkReNamer-$label-windows" | Out-File `
            -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "SOURCE_DATE_EPOCH=$epoch" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install pinned Rust and verified release tools
        shell: pwsh
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          cargo install --locked cargo-audit --version 0.22.2
          if ($LASTEXITCODE -ne 0) { throw 'cargo-audit installation failed.' }
          cargo install --locked cargo-deny --version 0.20.2
          if ($LASTEXITCODE -ne 0) { throw 'cargo-deny installation failed.' }
          cargo install --locked cargo-about --version 0.9.2 --features cli
          if ($LASTEXITCODE -ne 0) { throw 'cargo-about installation failed.' }
          $archive = Join-Path $env:RUNNER_TEMP 'cargo-cyclonedx-0.5.9.zip'
          $tools = Join-Path $env:RUNNER_TEMP 'cargo-cyclonedx-0.5.9'
          Invoke-WebRequest `
            -Uri 'https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.9/cargo-cyclonedx-x86_64-pc-windows-msvc.zip' `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = '8750e00775661dcb75bc482c1a298839fd94e8a0c033b49905ba0f246ffed202'
          if ($actual -ne $expected) { throw 'cargo-cyclonedx checksum mismatch.' }
          Expand-Archive -Path $archive -DestinationPath $tools
          Add-Content -Path $env:GITHUB_PATH -Value $tools
          $env:PATH = "$tools;$env:PATH"
          cargo cyclonedx --version
          if ($LASTEXITCODE -ne 0) { throw 'cargo-cyclonedx verification failed.' }

      - name: Test and build selected source
        shell: pwsh
        run: |
          if ($env:SOURCE_DATE_EPOCH -notmatch '^\d+$') {
            throw 'SOURCE_DATE_EPOCH was not established before the build.'
          }
          cargo audit --deny warnings
          if ($LASTEXITCODE -ne 0) { throw 'Selected dependency audit failed.' }
          cargo deny check
          if ($LASTEXITCODE -ne 0) { throw 'Selected dependency policy check failed.' }
          $env:DARKRENAMER_REQUIRE_WINDOWS_BACKEND_CAPABILITIES = '1'
          cargo test --workspace --all-targets --all-features --locked -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Selected workspace tests failed.' }
          cargo build --release --locked --package darknamer-app --bin DarkReNamer
          if ($LASTEXITCODE -ne 0) { throw 'Selected Windows build failed.' }

      - name: Generate release files
        shell: pwsh
        run: |
          $productNotes = & ./scripts/get-release-product-notes.ps1 -SourceRoot $PWD
          if ([string]::IsNullOrWhiteSpace($productNotes)) { throw 'Product release notes are missing.' }
          cargo cyclonedx --manifest-path crates/darknamer-app/Cargo.toml `
            --format json `
            --describe binaries `
            --target x86_64-pc-windows-msvc `
            --target-in-filename `
            --spec-version 1.5
          if ($LASTEXITCODE -ne 0) { throw 'CycloneDX generation failed.' }
          New-Item -ItemType Directory -Path dist | Out-Null
          cargo about generate --locked --workspace --fail about.hbs `
            --output-file dist/THIRD_PARTY_LICENSES.html
          if ($LASTEXITCODE -ne 0) { throw 'Third-party license generation failed.' }
          Copy-Item target/release/DarkReNamer.exe dist/DarkReNamer.exe
          Copy-Item target/release/DarkReNamer.pdb dist/DarkReNamer.pdb
          $cycloneDxSerial = "urn:uuid:$([Guid]::NewGuid().ToString('D').ToLowerInvariant())"
          ./scripts/prepare-release-cyclonedx.ps1 `
            -InputPath crates/darknamer-app/DarkReNamer_bin_x86_64-pc-windows-msvc.cdx.json `
            -OutputPath dist/DarkReNamer.cdx.json `
            -SerialNumber $cycloneDxSerial
          if ($LASTEXITCODE -ne 0) { throw 'CycloneDX release preparation failed.' }
          Copy-Item LICENSE dist/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          Copy-Item DISTRIBUTION.md dist/DISTRIBUTION.md
          Compress-Archive -Path dist/DarkReNamer.pdb `
            -DestinationPath dist/DarkReNamer-debug-symbols.zip
          ./scripts/write-release-files.ps1 `
            -SourceRoot $PWD `
            -HandoffRoot (Join-Path $PWD 'dist') `
            -SourceSha '${{ steps.source.outputs.source_commit }}' `
            -RunId $env:GITHUB_RUN_ID `
            -RunAttempt $env:GITHUB_RUN_ATTEMPT `
            -TemporaryRoot $env:RUNNER_TEMP

      - name: Validate complete release handoff
        shell: pwsh
        run: >-
          ./scripts/validate-release-handoff.ps1
          -SourceRoot $PWD
          -HandoffRoot (Join-Path $PWD 'dist')

      - name: Summarize information-only release metrics
        shell: pwsh
        run: |
          $metrics = Get-Content -LiteralPath dist/release-metrics.json -Raw | ConvertFrom-Json
          $rows = [ordered]@{
            schema_version = $metrics.schema_version
            source_sha = $metrics.source_sha
            rustc_version = $metrics.rustc_version
            target_triple = $metrics.target_triple
            darkrenamer_exe_bytes = $metrics.darkrenamer_exe_bytes
            darkrenamer_text_raw_bytes = $metrics.darkrenamer_text_raw_bytes
            debug_symbols_pdb_bytes = $metrics.debug_symbols_pdb_bytes
            debug_symbols_zip_bytes = $metrics.debug_symbols_zip_bytes
            sbom_bytes = $metrics.sbom_bytes
            cargo_lock_package_count = $metrics.cargo_lock_package_count
          }
          @(
            '## Release metrics (information only)'
            ''
            'These observed values are not release size or dependency-count thresholds.'
            ''
            '| Field | Value |'
            '| --- | --- |'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          foreach ($entry in $rows.GetEnumerator()) {
            $value = "$($entry.Value)".Replace('|', '\|')
            "| ``$($entry.Key)`` | ``$value`` |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Attest candidate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attest candidate executable SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/DarkReNamer.exe
          sbom-path: dist/DarkReNamer.cdx.json

      - name: Retain immutable release candidate handoff
        id: candidate_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.source.outputs.handoff_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Summarize immutable candidate identity
        shell: pwsh
        run: |
          @(
            ''
            '## Immutable candidate artifact'
            ''
            '- artifact-id: ${{ steps.candidate_artifact.outputs.artifact-id }}'
            '- artifact-digest: ${{ steps.candidate_artifact.outputs.artifact-digest }}'
            '- artifact-url: ${{ steps.candidate_artifact.outputs.artifact-url }}'
            '- run-id: ${{ github.run_id }}'
            '- run-attempt: ${{ github.run_attempt }}'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
