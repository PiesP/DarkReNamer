name: Code Scanning

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  rust-dependency-audit:
    name: Rust dependency audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select patched CPython
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          architecture: x64
          freethreaded: false

      - name: Verify selected Python
        env:
          DARKRENAMER_PYTHON: ${{ steps.python.outputs.python-path }}
          PYTHON_JIT: '0'
        run: |
          "$DARKRENAMER_PYTHON" -I scripts/check-python-runtime.py --exact "$(cat .python-version)"
          printf 'DARKRENAMER_PYTHON=%s\nPYTHON_JIT=0\n' "$DARKRENAMER_PYTHON" >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Read reviewed Rust scanner pins
        id: scanner-pins
        run: |
          "$DARKRENAMER_PYTHON" -I scripts/run-scheduled-rust-audit.py --emit-pins

      - name: Restore pinned Rust security tools
        id: security-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/darkrenamer-security-tools
          key: darkrenamer-security-tools-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-audit-${{ hashFiles('config/release-tool-integrity.json', 'config/cargo-audit-0.22.2-patched.lock', 'scripts/build-patched-cargo-audit.py') }}-deny-${{ steps.scanner-pins.outputs.deny-version }}

      - name: Install pinned Rust security tools
        if: steps.security-tools-cache.outputs.cache-hit != 'true'
        env:
          SECURITY_TOOLS_ROOT: ${{ runner.temp }}/darkrenamer-security-tools
          DENY_VERSION: ${{ steps.scanner-pins.outputs.deny-version }}
        run: |
          "$DARKRENAMER_PYTHON" -I scripts/build-patched-cargo-audit.py --destination "$SECURITY_TOOLS_ROOT/bin" --work "$RUNNER_TEMP/darkrenamer-cargo-audit-build"
          cargo install --locked --root "$SECURITY_TOOLS_ROOT" cargo-deny --version "$DENY_VERSION"

      - name: Refresh and audit Rust dependencies
        id: audit
        env:
          SECURITY_TOOLS_ROOT: ${{ runner.temp }}/darkrenamer-security-tools
        run: |
          "$DARKRENAMER_PYTHON" -I scripts/run-scheduled-rust-audit.py

      - name: Summarize setup failure
        if: failure() && steps.audit.outcome == 'skipped'
        run: |
          {
            echo '## Rust dependency audit'
            echo
            echo "Source: \`$GITHUB_SHA\`"
            echo
            echo 'Result: tool, checkout, or runner failure before the audit; see the failed step.'
          } >> "$GITHUB_STEP_SUMMARY"

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [rust, python, actions]
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}
