name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify documentation changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify with protected policy
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          docs_only=false
          base=''
          if [[ "$EVENT_NAME" == pull_request || "$EVENT_NAME" == merge_group ]]; then
            if git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master; then
              base="$(git rev-parse --verify 'refs/remotes/origin/master^{commit}')"
            fi
          elif [[ "$EVENT_NAME" == push ]]; then
            base="$EVENT_BEFORE"
          fi
          head="$(git rev-parse HEAD)"
          if [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" == "$EVENT_SHA" ]] &&
             git merge-base --is-ancestor "$base" "$head"; then
            policy="$(mktemp "$RUNNER_TEMP/darkrenamer-doc-policy.XXXXXXXX.py")"
            decision="$(mktemp "$RUNNER_TEMP/darkrenamer-doc-decision.XXXXXXXX")"
            trap 'rm -f "$policy" "$decision"' EXIT
            if git show "$base:scripts/classify-ci-docs.py" > "$policy"; then
              if python3 -I "$policy" "$base" "$head" > "$decision" &&
                 cmp -s "$decision" <(printf true); then
                docs_only=true
              fi
            fi
          fi
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"

  quality:
    name: pr-gate/quality
    needs: [classify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        id: checkout
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
        run: rustup toolchain install

      - name: Enforce the Rust-only source tree
        id: inventory
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          forbidden_sources="$(git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.rc' '*.dsp' '*.dsw' '*.aps' '*.ncb' '*.opt' '*.plg' '*.clw')"
          if [[ -n "$forbidden_sources" ]]; then
            printf 'Non-Rust legacy sources are tracked:\n%s\n' "$forbidden_sources" >&2
            exit 1
          fi
          tracked_acceptance_evidence="$(git ls-files ':(glob,icase)**/windows-acceptance-evidence-*.json')"
          if [[ -n "$tracked_acceptance_evidence" ]]; then
            printf 'Windows acceptance evidence must remain external:\n%s\n' "$tracked_acceptance_evidence" >&2
            exit 1
          fi
          tracked_docs="$(git ls-files '*.md' '*.txt' | LC_ALL=C sort)"
          expected_docs="$(LC_ALL=C sort config/tracked-documents.txt)"
          if [[ "$tracked_docs" != "$expected_docs" ]]; then
            printf 'Tracked documentation differs from the repository policy:\n%s\n' "$tracked_docs" >&2
            exit 1
          fi

      - name: Test tooling
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
        shell: pwsh
        run: ./scripts/test-tooling.ps1 -Platform Ubuntu -Scope ${{ github.event_name == 'workflow_dispatch' && 'All' || 'Current' }}

      - name: Check formatting and lints
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Rust and tooling verification not required for this change
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' && needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true' }}
        run: echo 'Rust and tooling verification not required for this documentation change.'

  unit:
    name: pr-gate/unit
    needs: [classify]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        id: checkout
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
        run: rustup toolchain install

      - name: Run workspace tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Workspace tests not required for this change
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true' }}
        run: echo 'Workspace tests not required for this documentation change.'

  security:
    name: pr-gate/security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Restore pinned Rust security tools
        id: security-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/darkrenamer-security-tools
          key: darkrenamer-security-tools-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-audit-0.22.2-deny-0.20.2

      - name: Install pinned Rust security tools
        if: steps.security-tools-cache.outputs.cache-hit != 'true'
        env:
          SECURITY_TOOLS_ROOT: ${{ runner.temp }}/darkrenamer-security-tools
        run: |
          cargo install --locked --root "$SECURITY_TOOLS_ROOT" cargo-audit --version 0.22.2
          cargo install --locked --root "$SECURITY_TOOLS_ROOT" cargo-deny --version 0.20.2

      - name: Refresh and audit Rust dependencies
        env:
          SECURITY_TOOLS_ROOT: ${{ runner.temp }}/darkrenamer-security-tools
        run: python3 scripts/run-scheduled-rust-audit.py

  windows:
    name: pr-gate/windows
    needs: [classify]
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout source
        id: checkout
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test tooling
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
        shell: pwsh
        run: ./scripts/test-tooling.ps1 -Platform Windows -Scope ${{ github.event_name == 'workflow_dispatch' && 'All' || 'Current' }}

      - name: Install pinned Rust toolchain
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
        shell: pwsh
        run: rustup toolchain install

      - name: Validate Windows tests and lints
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'The Windows Clippy gate failed.' }
          $env:DARKRENAMER_REQUIRE_WINDOWS_BACKEND_CAPABILITIES = '1'
          cargo test --workspace --all-targets --all-features --locked -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'The Windows test gate failed.' }

      - name: Test optimized workspace artifacts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
        shell: pwsh
        run: |
          $env:DARKRENAMER_REQUIRE_WINDOWS_BACKEND_CAPABILITIES = '1'
          cargo test --release --workspace --all-targets --all-features --locked -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'The optimized Windows test gate failed.' }

      - name: Build the compatibility executable
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.docs_only != 'true') }}
        shell: pwsh
        run: |
          cargo build --release --locked --package darknamer-app --bin DarkReNamer
          if ($LASTEXITCODE -ne 0) { throw 'The Windows release build failed.' }

      - name: Windows verification not required for this change
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true' }}
        shell: pwsh
        run: Write-Host 'Windows verification not required for this documentation change.'
