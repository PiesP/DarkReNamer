name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: pr-gate/quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Enforce the Rust-only source tree
        shell: bash
        run: |
          forbidden_sources="$(git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.rc' '*.dsp' '*.dsw' '*.aps' '*.ncb' '*.opt' '*.plg' '*.clw')"
          if [[ -n "$forbidden_sources" ]]; then
            printf 'Non-Rust legacy sources are tracked:\n%s\n' "$forbidden_sources" >&2
            exit 1
          fi
          tracked_acceptance_evidence="$(git ls-files ':(glob,icase)**/windows-acceptance-evidence-*.json')"
          if [[ -n "$tracked_acceptance_evidence" ]]; then
            printf 'Windows acceptance evidence must remain external:\n%s\n' "$tracked_acceptance_evidence" >&2
            exit 1
          fi
          tracked_docs="$(git ls-files '*.md' '*.txt' | LC_ALL=C sort)"
          expected_docs="$(printf '%s\n' \
            DISTRIBUTION.md \
            LICENSES/DarkNamer-MIT.txt \
            README.md \
            SAFETY.md \
            SECURITY.md \
            THIRD_PARTY_NOTICES.md \
            crates/darknamer-app/THIRD_PARTY_NOTICES.md)"
          if [[ "$tracked_docs" != "$expected_docs" ]]; then
            printf 'Tracked documentation differs from the repository policy:\n%s\n' "$tracked_docs" >&2
            exit 1
          fi

      - name: Test release handoff validation
        shell: pwsh
        run: ./scripts/test-release-handoff-validator.ps1

      - name: Test immutable release candidate metadata validation
        shell: pwsh
        run: ./scripts/test-release-candidate-metadata-validator.ps1

      - name: Test Windows acceptance evidence validation
        shell: pwsh
        run: ./scripts/test-windows-acceptance-evidence.ps1

      - name: Test Windows acceptance draft generation
        shell: pwsh
        run: ./scripts/test-new-windows-acceptance-draft.ps1

      - name: Test Windows acceptance benchmark augmentation
        shell: pwsh
        run: ./scripts/test-add-windows-acceptance-benchmark.ps1

      - name: Test release acceptance cross-validation
        shell: pwsh
        run: ./scripts/test-release-acceptance-validator.ps1

      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  unit:
    name: pr-gate/unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Run workspace tests
        run: cargo test --workspace --all-targets --all-features --locked

  security:
    name: pr-gate/security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust security tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2

      - name: Audit advisories, licenses, sources, and dependency policy
        run: |
          cargo audit --deny warnings
          cargo deny check

  windows:
    name: pr-gate/windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Windows acceptance evidence validation
        shell: pwsh
        run: ./scripts/test-windows-acceptance-evidence.ps1

      - name: Test immutable release candidate metadata validation
        shell: pwsh
        run: ./scripts/test-release-candidate-metadata-validator.ps1

      - name: Test Windows acceptance draft generation
        shell: pwsh
        run: ./scripts/test-new-windows-acceptance-draft.ps1

      - name: Test Windows acceptance benchmark augmentation
        shell: pwsh
        run: ./scripts/test-add-windows-acceptance-benchmark.ps1

      - name: Test release acceptance cross-validation
        shell: pwsh
        run: ./scripts/test-release-acceptance-validator.ps1

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component clippy

      - name: Validate Windows tests and lints
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'The Windows Clippy gate failed.' }
          $env:DARKRENAMER_REQUIRE_WINDOWS_BACKEND_CAPABILITIES = '1'
          cargo test --workspace --all-targets --all-features --locked -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'The Windows test gate failed.' }

      - name: Build the compatibility executable
        shell: pwsh
        run: |
          cargo build --release --locked --package darknamer-app --bin DarkReNamer
          if ($LASTEXITCODE -ne 0) { throw 'The Windows release build failed.' }
