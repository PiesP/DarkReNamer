name: Binary size matrix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-size-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: binary-size/release-profile-matrix
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Resolve source and output metadata
        shell: pwsh
        run: |
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -cnotmatch '^[0-9a-f]{40}$') {
            throw 'The selected source commit could not be resolved.'
          }
          $sourceEpoch = (git show -s --format=%ct HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceEpoch -notmatch '^[1-9][0-9]*$') {
            throw 'The selected source commit timestamp could not be resolved.'
          }
          $rustcVersion = (& rustc --version).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($rustcVersion)) {
            throw 'The pinned rustc version could not be resolved.'
          }
          $artifactRoot = Join-Path `
            $env:RUNNER_TEMP `
            "darkrenamer-binary-size-matrix-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $targetRoot = Join-Path `
            $env:RUNNER_TEMP `
            "darkrenamer-binary-size-target-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ((Test-Path -LiteralPath $artifactRoot) -or (Test-Path -LiteralPath $targetRoot)) {
            throw 'Binary-size matrix output roots must not already exist.'
          }
          New-Item -ItemType Directory -Path $artifactRoot, $targetRoot | Out-Null
          "SOURCE_SHA=$sourceSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_DATE_EPOCH=$sourceEpoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTC_VERSION=$rustcVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_ROOT=$artifactRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TARGET_ROOT=$targetRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and measure release profile variants serially
        shell: pwsh
        run: |
          foreach ($value in @(
              $env:SOURCE_SHA,
              $env:SOURCE_DATE_EPOCH,
              $env:RUSTC_VERSION,
              $env:ARTIFACT_ROOT,
              $env:TARGET_ROOT
          )) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw 'Required matrix source or output metadata is missing.'
            }
          }
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:SOURCE_DATE_EPOCH -notmatch '^[1-9][0-9]*$') {
            throw 'Matrix source metadata is malformed.'
          }

          $variants = @(
            [pscustomobject][ordered]@{
              id = 'current-3-3'; app_opt_level = '3'; core_opt_level = '3'
              app_toml = '3'; core_toml = '3'
            }
            [pscustomobject][ordered]@{
              id = 'app-s-core-3'; app_opt_level = 's'; core_opt_level = '3'
              app_toml = '"s"'; core_toml = '3'
            }
            [pscustomobject][ordered]@{
              id = 'app-s-core-s'; app_opt_level = 's'; core_opt_level = 's'
              app_toml = '"s"'; core_toml = '"s"'
            }
            [pscustomobject][ordered]@{
              id = 'app-2-core-3'; app_opt_level = '2'; core_opt_level = '3'
              app_toml = '2'; core_toml = '3'
            }
          )
          $results = [Collections.Generic.List[object]]::new($variants.Count)

          foreach ($variant in $variants) {
            $variantRoot = Join-Path $env:ARTIFACT_ROOT $variant.id
            $variantTarget = Join-Path $env:TARGET_ROOT $variant.id
            New-Item -ItemType Directory -Path $variantRoot, $variantTarget | Out-Null
            $configPath = Join-Path $variantRoot 'cargo-profile.toml'
            $configText = @(
              '[profile.release.package.darknamer-app]'
              "opt-level = $($variant.app_toml)"
              ''
              '[profile.release.package.darknamer-core]'
              "opt-level = $($variant.core_toml)"
              ''
            ) -join "`n"
            [IO.File]::WriteAllText(
              $configPath,
              $configText,
              [Text.UTF8Encoding]::new($false)
            )
            $configHash = (Get-FileHash `
                -LiteralPath $configPath `
                -Algorithm SHA256).Hash.ToLowerInvariant()

            $env:CARGO_TARGET_DIR = $variantTarget
            cargo --config $configPath build --release --locked `
              --package darknamer-app --bin DarkReNamer
            if ($LASTEXITCODE -ne 0) {
              throw "Release build failed for $($variant.id)."
            }

            $builtExecutable = Join-Path $variantTarget 'release/DarkReNamer.exe'
            $builtPdb = Join-Path $variantTarget 'release/DarkReNamer.pdb'
            foreach ($builtFile in $builtExecutable, $builtPdb) {
              if (-not (Test-Path -LiteralPath $builtFile -PathType Leaf)) {
                throw "Release build output is missing for $($variant.id): $builtFile"
              }
            }
            $executablePath = Join-Path $variantRoot 'DarkReNamer.exe'
            $pdbPath = Join-Path $variantRoot 'DarkReNamer.pdb'
            $symbolsPath = Join-Path $variantRoot 'DarkReNamer-debug-symbols.zip'
            $measurementPath = Join-Path $variantRoot 'binary-measurement.json'
            Copy-Item -LiteralPath $builtExecutable -Destination $executablePath
            Copy-Item -LiteralPath $builtPdb -Destination $pdbPath
            Compress-Archive -LiteralPath $pdbPath -DestinationPath $symbolsPath
            ./scripts/measure-windows-binary.ps1 `
              -ExecutablePath $executablePath `
              -PdbPath $pdbPath `
              -DebugSymbolsZipPath $symbolsPath `
              -OutputPath $measurementPath
            if ($LASTEXITCODE -ne 0) {
              throw "Binary measurement failed for $($variant.id)."
            }
            $measurement = Get-Content -LiteralPath $measurementPath -Raw | ConvertFrom-Json
            $results.Add([pscustomobject][ordered]@{
              id = $variant.id
              app_opt_level = $variant.app_opt_level
              core_opt_level = $variant.core_opt_level
              cargo_config_filename = "$($variant.id)/cargo-profile.toml"
              cargo_config_sha256 = $configHash
              executable_filename = "$($variant.id)/DarkReNamer.exe"
              pdb_filename = "$($variant.id)/DarkReNamer.pdb"
              debug_symbols_zip_filename = "$($variant.id)/DarkReNamer-debug-symbols.zip"
              measurement_filename = "$($variant.id)/binary-measurement.json"
              measurement = $measurement
            })
          }
          Remove-Item Env:CARGO_TARGET_DIR

          $matrix = [pscustomobject][ordered]@{
            schema_version = 1
            measurement_kind = 'release-profile-size-matrix'
            source_sha = $env:SOURCE_SHA
            source_date_epoch = [long] $env:SOURCE_DATE_EPOCH
            workflow_run = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            rustc_version = $env:RUSTC_VERSION
            target_triple = 'x86_64-pc-windows-msvc'
            cargo_toml_sha256 = ./scripts/get-git-blob-sha256.ps1 `
              -SourceRoot $PWD -Revision $env:SOURCE_SHA -Path Cargo.toml
            cargo_lock_sha256 = ./scripts/get-git-blob-sha256.ps1 `
              -SourceRoot $PWD -Revision $env:SOURCE_SHA -Path Cargo.lock
            rust_toolchain_toml_sha256 = ./scripts/get-git-blob-sha256.ps1 `
              -SourceRoot $PWD -Revision $env:SOURCE_SHA -Path rust-toolchain.toml
            variants = $results.ToArray()
          }
          [IO.File]::WriteAllText(
            (Join-Path $env:ARTIFACT_ROOT 'binary-size-matrix.json'),
            (($matrix | ConvertTo-Json -Depth 12) + "`n"),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Summarize binary size matrix
        shell: pwsh
        run: |
          $matrixPath = Join-Path $env:ARTIFACT_ROOT 'binary-size-matrix.json'
          $matrix = Get-Content -LiteralPath $matrixPath -Raw | ConvertFrom-Json
          @(
            '## Binary size matrix'
            ''
            "Source SHA: ``$($matrix.source_sha)``"
            ''
            '| Variant | App opt | Core opt | EXE bytes | .text raw bytes | PDB bytes | Symbols ZIP bytes |'
            '| --- | ---: | ---: | ---: | ---: | ---: | ---: |'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          foreach ($variant in $matrix.variants) {
            $measurement = $variant.measurement
            "| ``$($variant.id)`` | ``$($variant.app_opt_level)`` | ``$($variant.core_opt_level)`` | $($measurement.executable.bytes) | $($measurement.pe.text_raw_bytes) | $($measurement.debug_symbols.pdb_bytes) | $($measurement.debug_symbols.zip_bytes) |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Retain binary size matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DarkReNamer-binary-size-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/darkrenamer-binary-size-matrix-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
