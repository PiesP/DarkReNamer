name: Diagnose private VM ingress access

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful candidate workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Exact candidate workflow run attempt
        required: true
        type: string
      candidate_artifact_id:
        description: Immutable candidate artifact ID
        required: true
        type: string
      candidate_source_sha:
        description: Full candidate and trusted harness source SHA
        required: true
        type: string
      expected_exe_sha256:
        description: Candidate DarkReNamer.exe SHA-256
        required: true
        type: string
      ingress_release_id:
        description: Dedicated private draft ingress release ID
        required: true
        type: string
      ingress_asset_id:
        description: Exact private raw evidence asset ID
        required: true
        type: string
      ingress_archive_sha256:
        description: Raw evidence archive SHA-256
        required: true
        type: string
      ingress_archive_size:
        description: Raw evidence archive byte length
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vm-acceptance-${{ inputs.ingress_asset_id }}
  cancel-in-progress: false

jobs:
  contents-read:
    outputs:
      release_access: ${{ steps.probe.outputs.release_access }}
    if: github.actor == 'PiesP' && github.ref == 'refs/heads/codex/vm-private-ingress-access-probe'
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Diagnose metadata GET access only
        id: probe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $endpoints = [ordered]@{
            repository = 'repos/PiesP/DarkReNamer'
            release = 'repos/PiesP/DarkReNamer/releases/392487867'
            asset = 'repos/PiesP/DarkReNamer/releases/assets/577104129'
          }
          foreach ($entry in $endpoints.GetEnumerator()) {
            $stem = Join-Path $env:RUNNER_TEMP ('ingress-access-' + [guid]::NewGuid().ToString('N'))
            $outputFile = $stem + '.json'
            $errorFile = $stem + '.txt'
            try {
              & gh api $entry.Value 1> $outputFile 2> $errorFile
              $code = $LASTEXITCODE
              if ($entry.Key -eq "release") { "release_access=$((($code -eq 0).ToString()).ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append }
              $httpStatus = $null
              if ($code -ne 0) {
                $text = Get-Content -LiteralPath $errorFile -Raw
                $match = [regex]::Match($text, 'HTTP (\d{3})')
                if ($match.Success) { $httpStatus = [int]$match.Groups[1].Value }
              }
              [ordered]@{ diagnostic_only = $true; endpoint = $entry.Key; accessible = ($code -eq 0); http_status = $httpStatus } | ConvertTo-Json -Compress
            }
            finally {
              foreach ($file in @($outputFile, $errorFile)) {
                if (Test-Path -LiteralPath $file) { Remove-Item -LiteralPath $file -Force }
              }
            }
          }
          exit 0
  contents-write:
    needs: contents-read
    if: github.actor == 'PiesP' && github.ref == 'refs/heads/codex/vm-private-ingress-access-probe' && needs.contents-read.outputs.release_access == 'false'
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Diagnose metadata GET access only
        id: probe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $endpoints = [ordered]@{
            repository = 'repos/PiesP/DarkReNamer'
            release = 'repos/PiesP/DarkReNamer/releases/392487867'
            asset = 'repos/PiesP/DarkReNamer/releases/assets/577104129'
          }
          foreach ($entry in $endpoints.GetEnumerator()) {
            $stem = Join-Path $env:RUNNER_TEMP ('ingress-access-' + [guid]::NewGuid().ToString('N'))
            $outputFile = $stem + '.json'
            $errorFile = $stem + '.txt'
            try {
              & gh api $entry.Value 1> $outputFile 2> $errorFile
              $code = $LASTEXITCODE
              if ($entry.Key -eq "release") { "release_access=$((($code -eq 0).ToString()).ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append }
              $httpStatus = $null
              if ($code -ne 0) {
                $text = Get-Content -LiteralPath $errorFile -Raw
                $match = [regex]::Match($text, 'HTTP (\d{3})')
                if ($match.Success) { $httpStatus = [int]$match.Groups[1].Value }
              }
              [ordered]@{ diagnostic_only = $true; endpoint = $entry.Key; accessible = ($code -eq 0); http_status = $httpStatus } | ConvertTo-Json -Compress
            }
            finally {
              foreach ($file in @($outputFile, $errorFile)) {
                if (Test-Path -LiteralPath $file) { Remove-Item -LiteralPath $file -Force }
              }
            }
          }
          exit 0
