name: Promote portable prerelease

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful candidate workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Exact candidate workflow run attempt
        required: true
        type: string
      candidate_artifact_id:
        description: Immutable candidate artifact ID
        required: true
        type: string
      candidate_source_sha:
        description: Full candidate source SHA
        required: true
        type: string
      expected_exe_sha256:
        description: Candidate DarkReNamer.exe SHA-256
        required: true
        type: string
      release_tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: promote-prerelease-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    name: prerelease/promote-candidate
    environment:
      name: release
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Checkout current master with release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source and tag authority
        id: authority
        shell: pwsh
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          EXPECTED_EXE_SHA256: ${{ inputs.expected_exe_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          foreach ($entry in ([ordered]@{
              CANDIDATE_RUN_ID = $env:CANDIDATE_RUN_ID
              CANDIDATE_RUN_ATTEMPT = $env:CANDIDATE_RUN_ATTEMPT
              CANDIDATE_ARTIFACT_ID = $env:CANDIDATE_ARTIFACT_ID
            }).GetEnumerator()) {
            if ($entry.Value -notmatch '^[1-9][0-9]*$') {
              throw "$($entry.Key) must be a positive decimal integer."
            }
          }
          if ($env:CANDIDATE_SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'CANDIDATE_SOURCE_SHA must be a full lowercase Git SHA.'
          }
          if ($env:EXPECTED_EXE_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'EXPECTED_EXE_SHA256 must be a lowercase SHA-256 digest.'
          }
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'RELEASE_TAG must be a v-prefixed semantic version.'
          }

          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -cne $env:CANDIDATE_SOURCE_SHA) {
            throw 'Candidate source SHA does not match current master checkout.'
          }
          $masterCommit = (git rev-parse origin/master).Trim()
          if ($LASTEXITCODE -ne 0 -or $masterCommit -cne $sourceCommit) {
            throw 'Current checkout does not match origin/master.'
          }

          $cargo = Get-Content -LiteralPath Cargo.toml -Raw
          $versionMatches = [regex]::Matches($cargo, '(?m)^version = "([^"]+)"\r?$')
          if ($versionMatches.Count -ne 1) {
            throw 'Workspace version line must appear exactly once.'
          }
          $expectedTag = "v$($versionMatches[0].Groups[1].Value)"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Release tag $env:RELEASE_TAG does not match $expectedTag."
          }

          $taggedCommit = (git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $taggedCommit -cne $sourceCommit) {
            throw 'Release tag must already point to the candidate source commit.'
          }
          $remoteTag = @(& git ls-remote origin "refs/tags/$env:RELEASE_TAG^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Could not query the remote release tag.' }
          if ($remoteTag.Count -eq 0) {
            $remoteTag = @(& git ls-remote origin "refs/tags/$env:RELEASE_TAG")
          }
          if ($LASTEXITCODE -ne 0 -or $remoteTag.Count -ne 1 -or
              ($remoteTag[0] -split "`t")[0] -cne $sourceCommit) {
            throw 'Remote release tag does not point to the candidate source commit.'
          }

          $artifactName = "DarkReNamer-dry-run-$env:CANDIDATE_RUN_ID-$env:CANDIDATE_RUN_ATTEMPT-windows"
          "artifact_name=$artifactName" | Out-File `
            -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Fetch candidate run and artifact metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" `
            | Out-File -LiteralPath candidate-run.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Candidate workflow run metadata could not be downloaded.' }
          gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:CANDIDATE_ARTIFACT_ID" `
            | Out-File -LiteralPath candidate-artifact.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Candidate artifact metadata could not be downloaded.' }

      - name: Validate immutable candidate metadata
        shell: pwsh
        env:
          EXPECTED_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          EXPECTED_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          EXPECTED_ARTIFACT_NAME: ${{ steps.authority.outputs.artifact_name }}
        run: >-
          ./scripts/validate-release-candidate-metadata.ps1
          -RunMetadataPath candidate-run.json
          -ArtifactMetadataPath candidate-artifact.json
          -ExpectedRunId $env:EXPECTED_RUN_ID
          -ExpectedRunAttempt $env:EXPECTED_RUN_ATTEMPT
          -ExpectedArtifactId $env:EXPECTED_ARTIFACT_ID
          -ExpectedSourceSha $env:EXPECTED_SOURCE_SHA
          -ExpectedArtifactName $env:EXPECTED_ARTIFACT_NAME

      - name: Download exact immutable candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          path: dist

      - name: Revalidate handoff bytes and provenance
        shell: pwsh
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          EXPECTED_EXE_SHA256: ${{ inputs.expected_exe_sha256 }}
        run: |
          $handoff = ./scripts/validate-release-handoff.ps1 `
            -SourceRoot $PWD `
            -HandoffRoot (Join-Path $PWD 'dist') `
            -PassThru
          if ($handoff.workflow_run -cne $env:CANDIDATE_RUN_ID) {
            throw 'Release handoff workflow_run does not match the candidate run.'
          }
          if ($handoff.source_sha -cne $env:CANDIDATE_SOURCE_SHA) {
            throw 'Release handoff source_sha does not match the candidate source.'
          }
          if ($handoff.executable.sha256 -cne $env:EXPECTED_EXE_SHA256) {
            throw 'Release handoff executable digest does not match the expected candidate digest.'
          }

      - name: Verify original candidate attestation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
        run: |
          gh attestation verify dist/DarkReNamer.exe `
            --repo $env:GITHUB_REPOSITORY `
            --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yaml" `
            --source-digest $env:CANDIDATE_SOURCE_SHA `
            --source-ref refs/heads/master `
            --deny-self-hosted-runners
          if ($LASTEXITCODE -ne 0) { throw 'Original candidate attestation verification failed.' }

      - name: Revalidate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
        run: |
          $remoteMaster = @(& git ls-remote origin refs/heads/master)
          if ($LASTEXITCODE -ne 0 -or $remoteMaster.Count -ne 1 -or
              ($remoteMaster[0] -split "`t")[0] -cne $env:CANDIDATE_SOURCE_SHA) {
            throw 'Live origin/master changed after candidate validation.'
          }
          $remoteTag = @(& git ls-remote origin "refs/tags/$env:RELEASE_TAG^{}")
          if ($remoteTag.Count -eq 0) {
            $remoteTag = @(& git ls-remote origin "refs/tags/$env:RELEASE_TAG")
          }
          if ($LASTEXITCODE -ne 0 -or $remoteTag.Count -ne 1 -or
              ($remoteTag[0] -split "`t")[0] -cne $env:CANDIDATE_SOURCE_SHA) {
            throw 'Release tag changed after candidate validation.'
          }

      - name: Publish exact unsigned source-complete prerelease
        shell: pwsh
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          EXPECTED_EXE_SHA256: ${{ inputs.expected_exe_sha256 }}
        run: |
          @(
            'Source-complete Windows prerelease. The published files are the exact immutable candidate artifact; they were not rebuilt during promotion.'
            ''
            'Desktop acceptance is not complete. Real Windows 10/11 interactive UI coverage and physical SSD evidence remain external and must not be inferred from hosted Windows checks.'
            ''
            "Candidate source: $env:CANDIDATE_SOURCE_SHA"
            "Candidate workflow: $env:CANDIDATE_RUN_ID (attempt $env:CANDIDATE_RUN_ATTEMPT)"
            "Candidate artifact ID: $env:CANDIDATE_ARTIFACT_ID"
            "DarkReNamer.exe SHA-256: $env:EXPECTED_EXE_SHA256"
            ''
            'The executable is intentionally unsigned. Verify SHA256SUMS.txt and the original candidate attestation before use.'
          ) | Out-File -LiteralPath release-notes.md -Encoding utf8

          gh release create $env:RELEASE_TAG `
            --verify-tag `
            --prerelease `
            --title "DarkReNamer $env:RELEASE_TAG" `
            --notes-file release-notes.md `
            dist/DarkReNamer.exe `
            dist/DarkReNamer.cdx.json `
            dist/DarkReNamer-debug-symbols.zip `
            dist/SHA256SUMS.txt `
            dist/LICENSE `
            dist/THIRD_PARTY_NOTICES.md `
            dist/DISTRIBUTION.md `
            dist/release-handoff.json `
            dist/release-metrics.json
          if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease publication failed.' }
