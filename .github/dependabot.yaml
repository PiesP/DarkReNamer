version: 2
updates:
  # Review routine versions weekly; handle relevant advisories and confirmed
  # compiler/dependency blockers promptly through normal review and validation,
  # retaining the existing policy for approved dependency-age exceptions.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    reviewers: ["PiesP"]
    labels: ["dependencies", "rust", "automated"]
    commit-message:
      prefix: "chore(deps-rust)"
    groups:
      rust:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 2
    reviewers: ["PiesP"]
    labels: ["dependencies", "rust", "automated"]
    commit-message:
      prefix: "chore(toolchain)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 3
    reviewers: ["PiesP"]
    labels: ["ci", "dependencies", "automated"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
